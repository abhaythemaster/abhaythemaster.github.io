<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AbhayTheMaster — Official</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Exo+2:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet" />
  <style>
    /* ─── RESET & BASE ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep:      #030d1a;
      --bg-mid:       #060f20;
      --bg-surface:   #0a1628;
      --cyan-bright:  #00f0ff;
      --cyan-mid:     #00c8d8;
      --cyan-dim:     #0090a8;
      --blue-accent:  #0047ab;
      --text-primary: #e8f4f8;
      --text-muted:   #7aa0b8;
      --glass-bg:     rgba(10, 30, 60, 0.45);
      --glass-border: rgba(0, 200, 216, 0.18);
      --glass-blur:   blur(18px);
      --radius:       14px;
      --transition:   0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html { scroll-behavior: smooth; overflow-x: hidden; }

    body {
      font-family: 'Exo 2', sans-serif;
      background: var(--bg-deep);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─── BACKGROUND GRADIENT MESH ─────────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(0, 100, 180, 0.22) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 80%, rgba(0, 200, 216, 0.12) 0%, transparent 55%),
        radial-gradient(ellipse 50% 70% at 50% 50%, rgba(0, 71, 171, 0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ─── SCROLLBAR ─────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-deep); }
    ::-webkit-scrollbar-thumb { background: var(--cyan-dim); border-radius: 99px; }

    /* ─── NAVBAR ────────────────────────────────────────────────── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 0 2rem;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(3, 13, 26, 0.72);
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      border-bottom: 1px solid rgba(0, 200, 216, 0.1);
      transition: background var(--transition);
    }

    .nav-logo {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: 0.06em;
      color: var(--cyan-bright);
      text-decoration: none;
      text-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
    }

    /* ─── HAMBURGER ─────────────────────────────────────────────── */
    .hamburger {
      position: relative;
      width: 40px;
      height: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      backdrop-filter: var(--glass-blur);
      transition: border-color var(--transition), background var(--transition);
      z-index: 200;
    }
    .hamburger:hover { border-color: var(--cyan-mid); background: rgba(0, 200, 216, 0.12); }

    .hamburger span {
      display: block;
      width: 20px;
      height: 2px;
      background: var(--cyan-bright);
      border-radius: 2px;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease, width 0.3s ease;
      transform-origin: center;
    }
    .hamburger.open span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; width: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

    /* ─── DRAWER ────────────────────────────────────────────────── */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(3, 13, 26, 0.6);
      backdrop-filter: blur(4px);
      z-index: 150;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .drawer-overlay.active { opacity: 1; pointer-events: all; }

    .drawer {
      position: fixed;
      top: 0; right: 0;
      width: min(340px, 88vw);
      height: 100vh;
      z-index: 160;
      background: rgba(6, 16, 36, 0.78);
      backdrop-filter: blur(28px) saturate(1.5);
      -webkit-backdrop-filter: blur(28px) saturate(1.5);
      border-left: 1px solid rgba(0, 200, 216, 0.2);
      transform: translateX(100%);
      transition: transform 0.48s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      padding: 100px 2.5rem 3rem;
    }
    .drawer.open { transform: translateX(0); }

    .drawer-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--cyan-dim);
      margin-bottom: 2.5rem;
    }

    .drawer-nav {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      flex: 1;
    }

    .drawer-nav a {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.9rem 1.2rem;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      border-radius: 10px;
      border: 1px solid transparent;
      transition: color var(--transition), background var(--transition), border-color var(--transition), transform 0.25s ease;
    }
    .drawer-nav a:hover {
      color: var(--cyan-bright);
      background: rgba(0, 200, 216, 0.08);
      border-color: rgba(0, 200, 216, 0.2);
      transform: translateX(4px);
    }

    .drawer-nav a .nav-icon {
      width: 20px;
      height: 20px;
      opacity: 0.6;
      transition: opacity var(--transition);
      flex-shrink: 0;
    }
    .drawer-nav a:hover .nav-icon { opacity: 1; }

    .drawer-footer {
      font-size: 0.75rem;
      color: var(--text-muted);
      opacity: 0.5;
      text-align: center;
      margin-top: 2rem;
    }

    /* ─── SECTIONS SHARED ───────────────────────────────────────── */
    section {
      position: relative;
      z-index: 1;
      padding: 5rem 2rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    .section-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--cyan-mid);
      margin-bottom: 0.8rem;
    }

    .section-title {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 1.2rem;
      line-height: 1.2;
    }

    .section-title span { color: var(--cyan-bright); }

    .divider {
      width: 48px;
      height: 2px;
      background: linear-gradient(90deg, var(--cyan-bright), transparent);
      margin-bottom: 3rem;
    }

    /* ─── GLASS CARD ────────────────────────────────────────────── */
    .glass-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      padding: 2rem;
      transition: border-color var(--transition), transform var(--transition), box-shadow var(--transition);
    }
    .glass-card:hover {
      border-color: rgba(0, 200, 216, 0.38);
      transform: translateY(-4px);
      box-shadow: 0 16px 48px rgba(0, 200, 216, 0.08), 0 0 0 1px rgba(0, 200, 216, 0.1);
    }

    /* ─── HERO ──────────────────────────────────────────────────── */
    #hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding-top: 100px;
      padding-bottom: 4rem;
    }

    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--cyan-mid);
      background: rgba(0, 200, 216, 0.08);
      border: 1px solid rgba(0, 200, 216, 0.22);
      border-radius: 99px;
      padding: 0.45rem 1.1rem;
      margin-bottom: 2rem;
      opacity: 0;
      animation: fadeUp 0.7s 0.2s forwards;
    }
    .hero-eyebrow::before {
      content: '';
      width: 6px; height: 6px;
      background: var(--cyan-bright);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--cyan-bright);
    }

    .hero-heading {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2.6rem, 8vw, 5.5rem);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -0.01em;
      margin-bottom: 1.4rem;
      opacity: 0;
      animation: fadeUp 0.7s 0.35s forwards;
    }

    .hero-heading .line1 {
      display: block;
      background: linear-gradient(135deg, #ffffff 0%, var(--cyan-bright) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-heading .line2 {
      display: block;
      color: var(--cyan-bright);
      text-shadow: 0 0 40px rgba(0, 240, 255, 0.35);
    }

    .hero-sub {
      font-size: clamp(0.9rem, 2.5vw, 1.15rem);
      color: var(--text-muted);
      font-weight: 300;
      letter-spacing: 0.04em;
      margin-bottom: 3rem;
      max-width: 560px;
      line-height: 1.7;
      opacity: 0;
      animation: fadeUp 0.7s 0.5s forwards;
    }

    .hero-sub strong {
      color: var(--text-primary);
      font-weight: 500;
    }

    .hero-cta {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      opacity: 0;
      animation: fadeUp 0.7s 0.65s forwards;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.8rem 1.8rem;
      background: linear-gradient(135deg, var(--cyan-mid), var(--blue-accent));
      color: #fff;
      font-family: 'Exo 2', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-decoration: none;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
      box-shadow: 0 4px 24px rgba(0, 200, 216, 0.3);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0, 200, 216, 0.45);
      filter: brightness(1.1);
    }

    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.8rem 1.8rem;
      background: var(--glass-bg);
      color: var(--cyan-bright);
      font-family: 'Exo 2', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-decoration: none;
      border-radius: 8px;
      border: 1px solid var(--glass-border);
      cursor: pointer;
      backdrop-filter: var(--glass-blur);
      transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
    }
    .btn-ghost:hover {
      transform: translateY(-2px);
      border-color: var(--cyan-mid);
      background: rgba(0, 200, 216, 0.12);
      box-shadow: 0 0 20px rgba(0, 200, 216, 0.15);
    }

    .hero-stats {
      display: flex;
      gap: 2.5rem;
      margin-top: 4rem;
      flex-wrap: wrap;
      opacity: 0;
      animation: fadeUp 0.7s 0.8s forwards;
    }

    .hero-stat {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }
    .hero-stat-num {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--cyan-bright);
      line-height: 1;
    }
    .hero-stat-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .hero-stat-divider {
      width: 1px;
      background: rgba(0, 200, 216, 0.2);
      align-self: stretch;
    }

    /* ─── WHO IS THIS ───────────────────────────────────────────── */
    #who {
      padding-top: 6rem;
    }

    .who-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-top: 0;
    }

    @media (max-width: 700px) {
      .who-grid { grid-template-columns: 1fr; }
    }

    .who-main {
      grid-column: 1 / -1;
      padding: 2.5rem;
    }

    .who-main p {
      font-size: 1.05rem;
      line-height: 1.85;
      color: var(--text-muted);
      margin-bottom: 1.2rem;
    }
    .who-main p:first-child { color: var(--text-primary); font-size: 1.12rem; }
    .who-main p strong { color: var(--cyan-bright); font-weight: 600; }

    .who-tag {
      display: inline-block;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--cyan-mid);
      background: rgba(0, 200, 216, 0.08);
      border: 1px solid rgba(0, 200, 216, 0.18);
      border-radius: 4px;
      padding: 0.3rem 0.7rem;
      margin: 0.25rem 0.25rem 0 0;
    }

    .who-achievement {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .who-achievement .ach-icon {
      font-size: 1.5rem;
      margin-bottom: 0.3rem;
    }

    .who-achievement h4 {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .who-achievement p {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    /* ─── SKILLS ────────────────────────────────────────────────── */
    #skills { padding-top: 6rem; }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .skill-card {
      position: relative;
      overflow: hidden;
    }

    .skill-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      border-radius: var(--radius) var(--radius) 0 0;
      transition: opacity var(--transition);
    }

    .skill-python::before { background: linear-gradient(90deg, #3776ab, var(--cyan-bright)); }
    .skill-c::before      { background: linear-gradient(90deg, #5c6bc0, var(--cyan-mid)); }

    .skill-icon-wrap {
      width: 52px; height: 52px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      margin-bottom: 1.2rem;
      border: 1px solid var(--glass-border);
    }

    .skill-card h3 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 0.7rem;
    }

    .skill-card p {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.75;
      margin-bottom: 1.5rem;
    }

    .skill-bar-wrap { display: flex; flex-direction: column; gap: 0.7rem; }

    .skill-bar-row {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .skill-bar-row span:first-child { min-width: 80px; letter-spacing: 0.05em; }

    .skill-bar {
      flex: 1;
      height: 4px;
      background: rgba(0, 200, 216, 0.1);
      border-radius: 99px;
      overflow: hidden;
    }

    .skill-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--cyan-bright), var(--blue-accent));
      border-radius: 99px;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .skill-bar-fill.animate { transform: scaleX(1); }

    .skill-bar-row span:last-child { min-width: 32px; text-align: right; color: var(--cyan-dim); }

    /* ─── COMMUNITY ─────────────────────────────────────────────── */
    #community { padding-top: 6rem; }

    .community-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.2rem;
      margin-bottom: 2.5rem;
    }

    .stat-card {
      text-align: center;
      padding: 2.5rem 1.5rem;
      position: relative;
      overflow: hidden;
    }

    .stat-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(0, 200, 216, 0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    .stat-num {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2rem, 5vw, 2.8rem);
      font-weight: 900;
      color: var(--cyan-bright);
      line-height: 1;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
    }

    .stat-label {
      font-size: 0.82rem;
      color: var(--text-muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .stat-icon {
      font-size: 1.8rem;
      margin-bottom: 1rem;
      display: block;
    }

    .community-desc {
      padding: 2.5rem;
    }

    .community-desc p {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.8;
      margin-bottom: 1rem;
    }
    .community-desc p:last-child { margin-bottom: 0; }

    /* ─── SOCIAL LINKS ──────────────────────────────────────────── */
    #social { padding-top: 6rem; }

    .social-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.1rem;
    }

    .social-btn {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.1rem 1.4rem;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      text-decoration: none;
      color: var(--text-primary);
      font-size: 0.92rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: border-color var(--transition), background var(--transition), transform var(--transition), box-shadow var(--transition);
      position: relative;
      overflow: hidden;
    }

    .social-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(0, 200, 216, 0.0), rgba(0, 200, 216, 0.06));
      opacity: 0;
      transition: opacity var(--transition);
    }

    .social-btn:hover {
      border-color: rgba(0, 200, 216, 0.45);
      transform: translateY(-3px);
      box-shadow: 0 8px 32px rgba(0, 200, 216, 0.12), 0 0 0 1px rgba(0, 200, 216, 0.15);
    }
    .social-btn:hover::before { opacity: 1; }

    .social-btn-icon {
      width: 40px; height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
      border: 1px solid rgba(0, 200, 216, 0.15);
    }

    .social-btn-info { flex: 1; }
    .social-btn-name { display: block; font-weight: 600; color: var(--text-primary); }
    .social-btn-handle { display: block; font-size: 0.75rem; color: var(--text-muted); margin-top: 0.15rem; }

    .social-btn-arrow {
      font-size: 0.8rem;
      color: var(--cyan-dim);
      transition: transform var(--transition), color var(--transition);
    }
    .social-btn:hover .social-btn-arrow { transform: translateX(3px); color: var(--cyan-bright); }

    /* ─── CONTACT ───────────────────────────────────────────────── */
    #contact { padding-top: 6rem; padding-bottom: 8rem; }

    .contact-wrap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }

    @media (max-width: 700px) {
      .contact-wrap { grid-template-columns: 1fr; }
    }

    .contact-info h3 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 1rem;
    }

    .contact-info p {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.8;
      margin-bottom: 1.5rem;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.9rem 1.1rem;
      border-radius: 10px;
      background: rgba(0, 200, 216, 0.05);
      border: 1px solid rgba(0, 200, 216, 0.12);
      margin-bottom: 0.7rem;
      text-decoration: none;
      color: var(--text-primary);
      font-size: 0.87rem;
      transition: background var(--transition), border-color var(--transition);
    }
    .contact-item:hover { background: rgba(0, 200, 216, 0.1); border-color: rgba(0, 200, 216, 0.28); }

    .contact-item-icon { font-size: 1.1rem; flex-shrink: 0; }
    .contact-item-text { flex: 1; }
    .contact-item-label { display: block; font-size: 0.7rem; color: var(--text-muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.15rem; }
    .contact-item-value { display: block; color: var(--cyan-bright); }

    .contact-form-card {
      padding: 2.5rem;
    }

    .form-group { margin-bottom: 1.2rem; }

    .form-label {
      display: block;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .form-input, .form-textarea {
      width: 100%;
      background: rgba(0, 200, 216, 0.04);
      border: 1px solid rgba(0, 200, 216, 0.15);
      border-radius: 8px;
      padding: 0.8rem 1rem;
      color: var(--text-primary);
      font-family: 'Exo 2', sans-serif;
      font-size: 0.9rem;
      transition: border-color var(--transition), background var(--transition), box-shadow var(--transition);
      outline: none;
      resize: none;
    }

    .form-input:focus, .form-textarea:focus {
      border-color: var(--cyan-mid);
      background: rgba(0, 200, 216, 0.08);
      box-shadow: 0 0 0 3px rgba(0, 200, 216, 0.08);
    }

    .form-input::placeholder, .form-textarea::placeholder { color: rgba(122, 160, 184, 0.5); }
    .form-textarea { height: 110px; }

    .form-submit {
      width: 100%;
      padding: 0.9rem;
      background: linear-gradient(135deg, var(--cyan-mid), var(--blue-accent));
      border: none;
      border-radius: 8px;
      color: #fff;
      font-family: 'Exo 2', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: opacity var(--transition), transform var(--transition), box-shadow var(--transition);
      box-shadow: 0 4px 20px rgba(0, 200, 216, 0.25);
    }
    .form-submit:hover { opacity: 0.92; transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0, 200, 216, 0.38); }

    /* ─── FOOTER ────────────────────────────────────────────────── */
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2.5rem 2rem;
      border-top: 1px solid rgba(0, 200, 216, 0.1);
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    footer span { color: var(--cyan-dim); }

    /* ─── ANIMATIONS ────────────────────────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .reveal {
      opacity: 0;
      transform: translateY(32px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .reveal-delay-1 { transition-delay: 0.1s; }
    .reveal-delay-2 { transition-delay: 0.2s; }
    .reveal-delay-3 { transition-delay: 0.3s; }
    .reveal-delay-4 { transition-delay: 0.4s; }
    .reveal-delay-5 { transition-delay: 0.5s; }

    /* ─── SECTION DIVIDER ───────────────────────────────────────── */
    .section-sep {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 2rem;
    }
    .section-sep hr {
      border: none;
      border-top: 1px solid rgba(0, 200, 216, 0.08);
    }

    /* ─── RESPONSIVE TWEAKS ─────────────────────────────────────── */
    @media (max-width: 900px) {
      section { padding: 4rem 1.5rem; }
      .who-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 480px) {
      .hero-stats { gap: 1.5rem; }
      .hero-stat-divider { display: none; }
      nav { padding: 0 1.2rem; }
    }

    /* ─── TOAST ─────────────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: rgba(10, 30, 60, 0.9);
      border: 1px solid rgba(0, 200, 216, 0.3);
      border-radius: 10px;
      backdrop-filter: blur(20px);
      color: var(--cyan-bright);
      font-size: 0.85rem;
      padding: 0.8rem 1.6rem;
      z-index: 9999;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
